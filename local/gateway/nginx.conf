# Local API gateway (same routes as the helm chart's gateway). gRPC is never routed.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_tokens off;
  client_max_body_size 1m;

  # Resolve container names at request time, so the gateway starts even if a service is not up yet.
  resolver 127.0.0.11 valid=10s;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location /graphql {
    set $upstream http://user-service:8080;
    proxy_pass $upstream;
  }

  location /auth {
    set $upstream http://user-service:8080;
    proxy_pass $upstream;
  }

  location /payment-methods {
    set $upstream http://payment-service:5264;
    proxy_pass $upstream;
  }

  # Called by Stripe (signature-verified by PaymentService, no user auth).
  location = /stripe/webhooks {
    set $upstream http://payment-service:5264;
    proxy_pass $upstream;
  }

  location /provisions {
    set $upstream http://provisioning-service:8080;
    proxy_pass $upstream;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}
