{{- $cfg := .Values.userService -}}
{{- $name := "user-service" -}}
{{- $full := include "rso.name" (dict "root" . "name" $name) -}}
{{- $ownDb := not $cfg.database.existingSecret -}}
{{- $ownKey := not $cfg.auth.existingSecret -}}
{{- if or $ownDb $ownKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}
  labels:
    {{- include "rso.labels" (dict "root" . "name" $name) | nindent 4 }}
type: Opaque
stringData:
  {{- if $ownDb }}
  ConnectionStrings__DefaultConnection: {{ required "userService.database.connectionString is required" $cfg.database.connectionString | quote }}
  {{- end }}
  {{- if $ownKey }}
  Auth__SigningKey: {{ required "userService.auth.signingKey is required" $cfg.auth.signingKey | quote }}
  {{- end }}
---
{{- end }}
{{- $env := include "user-service.env" (dict "root" . "full" $full) }}
{{ include "rso.workload" (dict "root" . "name" $name "cfg" $cfg "ports" (list (dict "name" "http" "port" $cfg.port)) "env" $env "httpPort" $cfg.port) }}

{{- define "user-service.env" -}}
{{- $cfg := .root.Values.userService -}}
- name: ASPNETCORE_HTTP_PORTS
  value: {{ $cfg.port | quote }}
- name: Database__MigrateOnStartup
  value: {{ .root.Values.global.migrateOnStartup | quote }}
- name: Auth__Issuer
  value: {{ .root.Values.auth.issuer | quote }}
- name: Auth__Audience
  value: {{ .root.Values.auth.audience | quote }}
- name: Auth__TokenLifetime
  value: {{ $cfg.auth.tokenLifetime | quote }}
- name: Auth__SigningKey
  valueFrom:
    secretKeyRef:
      name: {{ default .full $cfg.auth.existingSecret }}
      key: Auth__SigningKey
- name: Nats__Url
  value: {{ required "nats.url is required" .root.Values.nats.url | quote }}
- name: ConnectionStrings__DefaultConnection
  valueFrom:
    secretKeyRef:
      name: {{ default .full $cfg.database.existingSecret }}
      key: ConnectionStrings__DefaultConnection
{{- end -}}
