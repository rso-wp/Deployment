{{- if .Values.frontend.enabled }}
{{- $cfg := .Values.frontend -}}
{{- $name := "frontend" -}}
{{- $full := include "rso.name" (dict "root" . "name" $name) -}}
{{- $ctx := dict "root" . "name" $name -}}
# Static Angular app on nginx (non-root image). Reached only through the gateway, which routes "/" here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}
  labels:
    {{- include "rso.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      {{- include "rso.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rso.selectorLabels" $ctx | nindent 8 }}
    spec:
      {{- include "rso.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx user of nginxinc/nginx-unprivileged
      containers:
        - name: nginx
          image: {{ include "rso.image" (dict "root" . "cfg" $cfg) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}
  labels:
    {{- include "rso.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rso.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $cfg.port }}
      targetPort: http
{{- end }}
