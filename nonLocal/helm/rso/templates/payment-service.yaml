{{- $cfg := .Values.paymentService -}}
{{- $name := "payment-service" -}}
{{- $full := include "rso.name" (dict "root" . "name" $name) -}}
{{- if or (not $cfg.database.existingSecret) (not $cfg.stripe.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}
  labels:
    {{- include "rso.labels" (dict "root" . "name" $name) | nindent 4 }}
type: Opaque
stringData:
  {{- if not $cfg.database.existingSecret }}
  ConnectionStrings__DefaultConnection: {{ required "paymentService.database.connectionString is required" $cfg.database.connectionString | quote }}
  {{- end }}
  {{- if not $cfg.stripe.existingSecret }}
  Stripe__SecretKey: {{ required "paymentService.stripe.secretKey is required" $cfg.stripe.secretKey | quote }}
  Stripe__WebhookSecret: {{ required "paymentService.stripe.webhookSecret is required" $cfg.stripe.webhookSecret | quote }}
  {{- end }}
---
{{- end }}
{{- $env := include "payment-service.env" (dict "root" . "full" $full) }}
{{ include "rso.workload" (dict "root" . "name" $name "cfg" $cfg "ports" (list (dict "name" "grpc" "port" $cfg.grpcPort) (dict "name" "http" "port" $cfg.httpPort)) "env" $env "httpPort" $cfg.httpPort) }}
{{- if $cfg.networkPolicy.enabled }}
---
# gRPC is reachable only from ProvisioningService pods. The REST port stays open to the gateway/cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-grpc
  labels:
    {{- include "rso.labels" (dict "root" . "name" $name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rso.selectorLabels" (dict "root" . "name" $name) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rso.selectorLabels" (dict "root" . "name" "provisioning-service") | nindent 14 }}
      ports:
        - port: {{ $cfg.grpcPort }}
    - ports:
        - port: {{ $cfg.httpPort }}
{{- end }}

{{- define "payment-service.env" -}}
{{- $cfg := .root.Values.paymentService -}}
- name: Database__MigrateOnStartup
  value: {{ .root.Values.global.migrateOnStartup | quote }}
- name: Auth__Issuer
  value: {{ .root.Values.auth.issuer | quote }}
- name: Auth__Audience
  value: {{ .root.Values.auth.audience | quote }}
- name: Auth__MetadataAddress
  value: {{ include "rso.userServiceMetadata" .root | quote }}
{{- with .root.Values.auth.signingPublicKey }}
- name: Auth__SigningPublicKey
  value: {{ . | toJson }}
{{- end }}
- name: Stripe__PublishableKey
  value: {{ $cfg.stripe.publishableKey | quote }}
- name: Nats__Url
  value: {{ required "nats.url is required" .root.Values.nats.url | quote }}
{{- range $i, $origin := $cfg.cors.allowedOrigins }}
- name: Cors__AllowedOrigins__{{ $i }}
  value: {{ $origin | quote }}
{{- end }}
- name: ConnectionStrings__DefaultConnection
  valueFrom:
    secretKeyRef:
      name: {{ default .full $cfg.database.existingSecret }}
      key: ConnectionStrings__DefaultConnection
- name: Stripe__SecretKey
  valueFrom:
    secretKeyRef:
      name: {{ default .full $cfg.stripe.existingSecret }}
      key: Stripe__SecretKey
- name: Stripe__WebhookSecret
  valueFrom:
    secretKeyRef:
      name: {{ default .full $cfg.stripe.existingSecret }}
      key: Stripe__WebhookSecret
{{- end -}}
