# Postgres is NOT part of this chart (provisioned with terraform). Pass connection strings below.

global:
  # Images are <imageRegistry>/<service.image.repository>:<service.image.tag>
  imageRegistry: docker.io/armodilo
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Apply EF Core migrations when a service starts (Database__MigrateOnStartup). Off: run them yourself.
  migrateOnStartup: false
  metrics:
    # Pod annotations prometheus.io/* on the platform services (/metrics, OpenTelemetry Prometheus exporter). Azure Managed
    # Prometheus picks them up (terraform sets podannotationnamespaceregex); turn off if nothing scrapes.
    scrape: true
  logging:
    # Name of a Secret with the key APPLICATIONINSIGHTS_CONNECTION_STRING. Set: the three services also send their logs to
    # Application Insights (a Log Analytics workspace, read in Grafana); terraform creates the Secret (enable_logging).
    # Empty: the logs only go to the console (kubectl logs).
    existingSecret: ""

# NATS with JetStream (not part of this chart), used by all three services: users.events.* (UserService -> PaymentService,
# ProvisioningService) and payments.events.* (PaymentService -> ProvisioningService). Provisioning uses storage queues.
nats:
  url: ""                  # e.g. nats://nats.messaging:4222

# Access tokens: Keycloak issues them (it owns sign-up, log-in and passwords, see "keycloak" below); UserService,
# PaymentService and ProvisioningService validate them with the signing keys they read from Keycloak's discovery document
# (cluster-internal, http://<release>-keycloak:8080/realms/<realm>/.well-known/openid-configuration).
auth:
  # The token's `iss`: the realm URL as the browser sees it. Empty: http://<keycloak.hostname>/realms/<keycloak.realm>
  # (set it when Keycloak is served over https).
  issuer: ""
  audience: rso-api      # `aud`, put in the token by a mapper of the realm's client

# ---------------------------------------------------------------------------
# Keycloak: sign-up, log-in, passwords, tokens. Its realm (the "rso" realm with the web app's client, sign-up switched on and
# the rso-api audience mapper) is imported from a ConfigMap on its first start; changing the values below afterwards does not
# change a realm that already exists (use the admin console, or delete its database). Uses its own PostgreSQL database.
# ---------------------------------------------------------------------------
keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.8.2"
  realm: rso
  hostname: ""           # required: where the browser reaches Keycloak, e.g. keycloak.<ip>.sslip.io (host only)
  appUrl: ""             # required: the web app's address, e.g. http://<ip>.sslip.io (redirect URI and web origin of its client)
  sslRequired: none      # the realm's "require SSL": none while everything is plain http (test only); external behind https
  ingress:
    enabled: true
    className: ""
    annotations: {}
  # Two Secrets (or one with all keys) that you manage:
  database:
    existingSecret: ""   # keys: KC_DB_URL (jdbc:postgresql://host:5432/KeycloakDb?sslmode=require), KC_DB_USERNAME, KC_DB_PASSWORD
  admin:
    existingSecret: ""   # keys: KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD (the first admin of the master realm)
  dbPoolMaxSize: 5       # small: a small PostgreSQL server allows few connections, shared with the services
  resources:
    # Small CPU request: a small node has little CPU to hand out (requests, not usage, decide what fits). It can still burst.
    requests: { cpu: 50m, memory: 768Mi }
    limits: { memory: 1536Mi }

# ---------------------------------------------------------------------------
# API gateway: the only thing exposed to the outside. Routes REST and GraphQL only,
# never gRPC (PaymentService :5263 is cluster-internal).
# ---------------------------------------------------------------------------
gateway:
  replicas: 2
  image:
    repository: nginx
    tag: 1.27-alpine
  service:
    type: ClusterIP        # use LoadBalancer if you do not use the ingress
    port: 80
  ingress:
    enabled: false
    className: ""
    host: ""               # e.g. api.example.com
    annotations: {}
    tls: []                # - secretName: rso-tls
                           #   hosts: [api.example.com]
  # path prefix -> backend. Add a route here to expose another endpoint.
  routes:
    - path: /graphql
      service: user-service
      port: 8080
    - path: /payment-methods
      service: payment-service
      port: 5264
    - path: /provisions
      service: provisioning-service
      port: 8080
    - path: /stripe/webhooks     # Stripe -> PaymentService (signature-verified, no user auth)
      service: payment-service
      port: 5264
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

# ---------------------------------------------------------------------------
# Frontend (WordpressAsAServiceUi, static files on nginx). The gateway sends every path that is not an API route
# to it, so the app and the APIs share one origin. Disabled: the gateway answers 404 there instead.
# ---------------------------------------------------------------------------
frontend:
  enabled: true
  replicas: 2
  image:
    repository: wordpressasaserviceui
    tag: v0.1.0
  port: 8080
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 64Mi }

# ---------------------------------------------------------------------------
# Platform services. Image names are placeholders until decided: armodilo/<folder>:vx.y.z (lowercase,
# because docker repository names must be lowercase).
# For each secret-bearing value use either the plain value (chart creates a Secret) or
# existingSecret (name of a Secret you manage, with the keys listed next to it).
# ---------------------------------------------------------------------------
userService:
  replicas: 1
  image:
    repository: userservice
    tag: v0.1.0
  port: 8080
  database:
    connectionString: ""   # Host=...;Port=5432;Database=UserServiceDb;Username=...;Password=...
    existingSecret: ""     # key: ConnectionStrings__DefaultConnection
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 384Mi }

paymentService:
  replicas: 1
  image:
    repository: paymentservice
    tag: v0.1.0
  grpcPort: 5263           # cluster-internal only
  httpPort: 5264
  cors:
    allowedOrigins: []     # frontend origins, e.g. [https://app.example.com]
  database:
    connectionString: ""
    existingSecret: ""     # key: ConnectionStrings__DefaultConnection
  stripe:
    secretKey: ""
    publishableKey: ""     # pk_... handed to the frontend for Stripe Elements (not a secret)
    webhookSecret: ""
    existingSecret: ""     # keys: Stripe__SecretKey, Stripe__WebhookSecret
  # Restrict the gRPC port to ProvisioningService pods. Needs a CNI that enforces NetworkPolicy.
  networkPolicy:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 384Mi }

provisioningService:
  replicas: 1
  image:
    repository: provisioningservice
    tag: v0.1.0
  port: 8080
  stripePriceId: ""        # Stripe Price of the WordPress subscription
  baseDomain: ""           # sites are served at <site>.<tenant>.<baseDomain>
  database:
    connectionString: ""
    existingSecret: ""     # key: ConnectionStrings__DefaultConnection
  # Azure Storage account with the provisioning queues (provision-site, deprovision-site, provisioning-events), shared
  # with ProvisionFunction (Azure Function). One of:
  queues:
    connectionString: ""   # storage account connection string (chart creates a Secret)
    existingSecret: ""     # key: ProvisioningQueues
    serviceUri: ""         # https://<account>.queue.core.windows.net, with a workload identity (pod setup not in the chart yet)
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 384Mi }

# ---------------------------------------------------------------------------
# Tenant WordPress site: subchart in charts/wordpress (see its values.yaml for all options).
# Normally installed per tenant by code, not with the platform, so it is off here.
# ---------------------------------------------------------------------------
wordpress:
  enabled: false
